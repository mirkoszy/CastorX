name: Build tenant Backstage image

on:
  push:
    branches: [main]
    paths:
      - tenant-backstage/**
      - .github/workflows/build-tenant-backstage.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: tenant-backstage
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/castorx-backstage:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/castorx-backstage:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
